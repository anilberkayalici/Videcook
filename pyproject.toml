[project]
name = "videcook"
version = "0.6.0"
description = "Windows desktop GUI wrapper around yt-dlp + cookies.txt + ffmpeg"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "groq>=1.5.0",
    "moviepy>=2.0.0",
    "pedalboard>=0.9.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.3",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
